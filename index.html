<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202b31"><title>Passa a Carta</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#f7eff5;background:#202b31}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#344149,#202b31 70%)}main{width:min(520px,100%);margin:auto;padding:24px 18px 50px}h1{font-size:30px;letter-spacing:-1px;margin:5px 0 9px}h2{font-size:23px;margin:0 0 14px}p{line-height:1.5;color:#c9c8d0}small,.muted{color:#b8b4c1}.eyebrow{color:#db91b7;letter-spacing:.17em;font-size:11px;font-weight:800;text-transform:uppercase}.panel{background:#29363c;border:1px solid #425058;border-radius:20px;padding:20px;margin:18px 0}.stack{display:grid;gap:12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.wrap{flex-wrap:wrap}button,input,select{font:inherit}input,select{width:100%;padding:13px 14px;border:1px solid #637079;border-radius:12px;background:#1d2a30;color:white}button{border:0;border-radius:13px;padding:14px 18px;font-weight:750;cursor:pointer;color:#231624;background:#d985b3}button:disabled{opacity:.4;cursor:not-allowed}button.secondary{background:#39464d;color:#f7eff5;border:1px solid #65717a}button.danger{background:#9b485f;color:#fff}button.full{width:100%}button:focus-visible{outline:3px solid white;outline-offset:2px}.chip{padding:7px 10px;border:1px solid #6c6671;border-radius:99px;font-size:12px}.player{padding:11px 13px;border-radius:11px;background:#344148;display:flex;align-items:center;justify-content:space-between;margin:7px 0}.cardrow{display:flex;justify-content:center;gap:15px;flex-wrap:wrap}.card{width:138px;height:198px;border-radius:15px;border:7px solid #f7f5f6;box-shadow:0 8px 24px #0003;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.front{background:white;color:#111}.back{background:#38113c;color:#d74b98}.card svg{width:90%;height:80%}.card .dir{position:absolute;top:39%;font-size:43px;font-weight:900;filter:drop-shadow(0 2px 1px #210f25)}.card .pattern{position:absolute;inset:0;font-size:24px;line-height:1.65;letter-spacing:7px;opacity:.62;overflow:hidden;word-break:break-all;transform:rotate(-8deg) scale(1.2);user-select:none}.card .dir.off{color:#81406d}.cardlabel{text-align:center;font-size:12px;color:#d6cbd4;margin-top:8px}.notice{padding:13px 15px;border-radius:13px;background:#463245;color:#f7d7ea}.error{background:#66343d;color:#ffe3e3}.center{text-align:center}.hide{display:none!important}hr{border:0;border-top:1px solid #526068;margin:18px 0} .symbol{font-size:78px;line-height:1} .big{font-size:27px;font-weight:800} .status{border:1px solid #6e566a;border-radius:12px;padding:12px;margin:12px 0} .titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.initial-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.initial-item{background:#344148;border:1px solid #49565e;border-radius:15px;padding:12px 7px;display:flex;flex-direction:column;align-items:center;gap:12px}.initial-item .card{width:min(125px,100%);height:174px}.initial-item .owner{text-align:center;display:flex;flex-direction:column;gap:4px;max-width:100%}.initial-item .owner strong{font-size:14px;overflow-wrap:anywhere}.initial-item .owner span{font-size:11px;color:#c9c8d0}.initial-item .cardlabel{font-size:11px}@media(min-width:440px){.initial-grid{grid-template-columns:repeat(3,minmax(0,1fr))}} 
/* Apresentação em destaque e mesa circular */
.my-spotlight{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 12px;background:linear-gradient(160deg,#3d3445,#29363c);border:1px solid #a85d91;border-radius:19px;margin:18px 0}
.my-spotlight .card{width:172px;height:239px}.my-spotlight .symbol{font-size:94px}.my-spotlight .eyebrow{font-size:12px}.other-strip{display:flex;gap:10px;overflow-x:auto;padding:8px 0 14px;scroll-snap-type:x mandatory}.other-person{flex:0 0 94px;text-align:center;scroll-snap-align:center}.other-person .card{width:82px;height:112px;border-width:4px;margin:auto}.other-person .symbol{font-size:47px}.other-person .cardlabel{font-size:11px}.other-person .ownername{font-size:12px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:6px}
.table-ring{position:relative;width:min(100%,400px);aspect-ratio:1;margin:10px auto 24px;border-radius:50%;border:2px dashed #63717a;background:radial-gradient(circle,#35434a 0%,#28343b 64%,#202b31 100%)}
.table-ring:before{content:'';position:absolute;inset:20%;border:1px solid #5d6570;border-radius:50%;pointer-events:none}
.table-person{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) translate(var(--x),var(--y));width:84px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;z-index:2}
.table-person .card{width:61px;height:84px;border-width:4px;border-radius:9px;box-shadow:0 4px 12px #0004}.table-person .symbol{font-size:39px}.table-person .pattern{font-size:10px}.table-person .dir{font-size:19px}.table-person .who{background:#25323b;border:1px solid #59626d;border-radius:30px;padding:4px 6px;max-width:96px;font-size:10px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.table-person.mine .who{background:#a94b86;border-color:#e2a2c8;color:#fff}.table-person.mine .card{box-shadow:0 0 0 3px #d985b3,0 7px 16px #0006}
.table-middle{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:flex;align-items:center;flex-direction:column;justify-content:center;text-align:center;z-index:1;width:110px}.table-middle .card{width:88px;height:124px;border-width:5px}.table-middle .symbol{font-size:53px}.table-middle .cardlabel{font-size:10px}.table-middle .centerlabel{font-size:12px;color:#e6c0d8;font-weight:700}
@media(max-width:390px){.table-person{width:70px}.table-person .card{width:51px;height:72px}.table-person .symbol{font-size:31px}.table-person .who{font-size:9px;max-width:74px}.table-middle .card{width:75px;height:108px}.table-middle .symbol{font-size:45px}}
</style></head><body><main><div class="titlebar"><div><div class="eyebrow">Party game</div><h1>Passa a Carta</h1></div><span class="chip" id="online">Conectando…</span></div><div id="alert" class="notice hide"></div><section id="screen"></section><p class="center"><small>As cartas circulam no aplicativo. As dicas e acusações são faladas pessoalmente.</small></p></main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js';
import {getDatabase,ref,onValue,runTransaction,onDisconnect} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js';
// PREENCHA com as credenciais do seu projeto Firebase:
const firebaseConfig={apiKey:'AIzaSyBm33czXi-uU2ZKTnWejm5ZNYDMmq80KL8',authDomain:'passa-a-carta.firebaseapp.com',databaseURL:'https://passa-a-carta-default-rtdb.firebaseio.com',projectId:'passa-a-carta',storageBucket:'passa-a-carta.firebasestorage.app',messagingSenderId:'750761558498',appId:'1:750761558498:web:39b9c5b7dc4d861cfcb9bb'};
const ROOT='game/partida_unica_v1'; const ICONS=['🎩','🎹','🌙','⭐','🐟','🌳','🔑','☂️','🚲','🍎','👑','✂️','🕯️','🐈','🌷','☀️','🏠','✉️','🎈','⏰','🦋','🍄','⚓','🎲'];
const $=s=>document.querySelector(s); const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,auth,uid='',state=null,connected=false,locked=false;const screen=$('#screen');const savedName=localStorage.getItem('pc_name')||'';
function alertMsg(msg,err=false){const el=$('#alert');el.textContent=msg;el.className='notice'+(err?' error':'');if(!msg)el.classList.add('hide')}
const active=s=>Object.values(s.players||{}).filter(p=>p.active).sort((a,b)=>a.seat-b.seat);
const player=(s,id)=>s.players?.[id];const name=(s,id)=>player(s,id)?.name||'Jogador';
function makeCard(s){let id;const used=new Set(Object.values(s.hands||{}).filter(Boolean).map(c=>c.id));do{id=Math.floor(Math.random()*ICONS.length)}while(used.size<ICONS.length&&used.has(id));return{id,dir:Math.random()<.5?'left':'right'};}
function neighbor(s,id,dir){const a=active(s);let i=a.findIndex(p=>p.id===id);if(i<0||a.length<2)return null;return a[(i+(dir==='left'?1:-1)+a.length)%a.length].id}
function card(c,visible=false){if(!c)return '<div class="card back"><span>?</span></div>';if(visible)return `<div class="card front"><span class="symbol">${ICONS[c.id]}</span></div>`;return `<div class="card back"><div class="pattern">♧ ☆ ◇ ♡ ♬ ☾ ✿ ♧ ☆ ◇ ♡ ♬ ☾ ✿ ♧ ☆ ◇ ♡ ♬ ☾ ✿ ♧ ☆ ◇ ♡ ♬ ☾ ✿</div><span class="dir ${c.dir==='left'?'':'off'}">↶</span><span class="dir ${c.dir==='right'?'':'off'}" style="transform:translateY(47px)">↷</span></div>`}
function labelCard(c,label,visible=false){return `<div><div>${card(c,visible)}</div><div class="cardlabel">${escape(label)}</div></div>`}
function ring(s,faceUp=false,extraCard=null){const ps=active(s);const n=ps.length;const meIndex=Math.max(0,ps.findIndex(p=>p.id===uid));const nodes=ps.map((p,i)=>{const angle=(i-meIndex)*Math.PI*2/n+Math.PI/2;const x=(Math.cos(angle)*38).toFixed(3),y=(Math.sin(angle)*38).toFixed(3);return `<div class="table-person ${p.id===uid?'mine':''}" style="--x:${x}cqw;--y:${y}cqw"><div class="who">${escape(p.name)}${p.id===uid?' · você':''}</div>${card(s.hands?.[p.id],faceUp)}</div>`}).join('');return `<div class="table-ring" style="container-type:inline-size">${nodes}<div class="table-middle">${extraCard?labelCard(extraCard,'Carta extra',true):'<div class="centerlabel">PASSA<br>A CARTA</div>'}</div></div>`}
function btn(text,action,cls=''){return `<button class="${cls}" data-action="${action}">${text}</button>`}
function initial(){return{phase:'lobby',host:uid,players:{},hands:{},turn:null,incoming:null,from:null,extra:null,reveal:null,ready:{},announcement:null,version:0}}
async function tx(fn){if(locked)return;locked=true;try{const result=await runTransaction(ref(db,ROOT),old=>{let s=old||initial();s.players ||= {};s.hands ||= {};s.ready ||= {};const next=fn(s);if(!next)return;next.version=(next.version||0)+1;return next},{applyLocally:false});if(!result.committed)alertMsg('A ação não pôde ser concluída. A partida pode ter avançado.');else alertMsg('')}catch(e){alertMsg('Não foi possível salvar a ação: '+e.message,true)}finally{locked=false}}
function render(){const s=state;if(!uid){screen.innerHTML='<div class="panel">Conectando ao jogo…</div>';return}if(!s||!player(s,uid)){screen.innerHTML=`<div class="panel stack"><h2>Entrar na mesa</h2><label>Seu nome<input id="myname" maxlength="24" value="${escape(savedName)}" placeholder="Como quer ser chamado?"></label><label>Posição na mesa<select id="seat"><option value="">Escolha sua posição</option>${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${Object.values(s?.players||{}).some(p=>p.seat===i+1)?'disabled':''}>${i+1}${Object.values(s?.players||{}).some(p=>p.seat===i+1)?' — ocupada':''}</option>`).join('')}</select></label>${btn('Entrar na partida','join','full')}</div>`;return}
const me=player(s,uid);let html=`<div class="row"><span class="chip">${escape(me.name)} · posição ${me.seat}</span><span class="chip">${active(s).length} jogadores</span></div>`;
if(!me.active){screen.innerHTML=html+`<div class="panel center"><h2>Você foi eliminado</h2><p>Acompanhe a partida com o grupo.</p>${s.phase==='finished'&&uid===s.host?btn('Voltar à sala de espera','reset','full'):''}</div>`;return}
if(s.phase==='lobby'){html+=`<div class="panel"><h2>Jogadores na mesa</h2>${active(s).map(p=>`<div class="player"><span>${p.seat}. ${escape(p.name)}</span>${p.id===s.host?'👑 Anfitrião':''}</div>`).join('')}<p class="muted">A posição 1 fica à esquerda da 2 e à direita da última posição. Ocupem posições consecutivas, sem lacunas. Para incluir mais amigos, peça que entrem no mesmo link enquanto esta tela estiver aberta.</p>${uid===s.host?`${btn('Iniciar partida','start','full')}<div class="stack" style="margin-top:12px">${btn('Reiniciar mesa (liberar todas as posições)','clearTable','full secondary')}</div>`: '<div class="notice">Aguardando o anfitrião iniciar.</div>'}<div style="margin-top:12px">${btn('Sair da mesa e liberar minha posição','leave','full secondary')}</div></div>`}
else if(s.phase==='memorize'){const others=active(s).filter(p=>p.id!==uid);html+=`<div class="panel"><div class="eyebrow">Etapa 1 · Memorizar</div><h2>Conheça as cartas</h2><p>As cartas dos outros jogadores estão acima. A sua está em destaque, no centro da tela.</p><div class="other-strip">${others.map(p=>`<div class="other-person"><div class="ownername">${escape(p.name)}</div>${card(s.hands[p.id],true)}<div class="cardlabel">Posição ${p.seat}</div></div>`).join('')}</div><div class="my-spotlight"><div class="eyebrow">Sua carta · Posição ${me.seat}</div>${card(s.hands[uid],true)}<strong>${escape(me.name)}</strong></div><p class="center">${active(s).filter(p=>s.ready?.[p.id]).length} de ${active(s).length} prontos</p>${s.ready?.[uid]?'<div class="notice center">Você está pronto. Aguardando os demais.</div>':btn('Memorizei minha carta','ready','full')}</div>`}
else if(s.phase==='tableReveal'){html+=`<div class="panel"><div class="eyebrow">Etapa 2 · Mesa</div><h2>Todos em suas posições</h2><p>Veja as cartas ao redor da mesa. <b>A sua está destacada em rosa.</b> Quando todos confirmarem, as cartas virarão e a carta extra será sorteada no centro.</p>${ring(s,true)}<p class="center">${active(s).filter(p=>s.ready?.[p.id]).length} de ${active(s).length} prontos</p>${s.ready?.[uid]?'<div class="notice center">Aguardando os demais jogadores virarem as cartas.</div>':btn('Estou pronto — virar as cartas','ready','full')}</div>`}
else if(s.phase==='extraReveal'){html+=`<div class="panel"><div class="eyebrow">Etapa 3 · Carta extra</div><h2>Nova carta no centro</h2><p>As cartas iniciais estão viradas. Memorize a carta extra de <b>${escape(name(s,s.turn))}</b> no meio da roda.</p>${ring(s,false,s.extra)}<p class="center">${active(s).filter(p=>s.ready?.[p.id]).length} de ${active(s).length} prontos</p>${s.ready?.[uid]?'<div class="notice center">Você está pronto. Aguardando os demais.</div>':btn('Memorizei a carta extra','ready','full')}</div>`}
else if(s.phase==='play'){if(uid===s.turn){let own=s.extra||s.hands[uid];const target=neighbor(s,uid,own.dir);html+=`<div class="panel"><h2>Sua vez!</h2><p>${s.extra?'Você começa com uma carta extra. Passe a carta extra.':`Você recebeu uma carta de <b>${escape(name(s,s.from))}</b>. Fale e passe sua carta antiga, ou revele a recebida.`}</p><div class="cardrow">${labelCard(own,s.extra?'Carta extra':'Sua carta antiga')}${s.incoming?labelCard(s.incoming,'Carta recebida'):''}</div><div class="status center">Sua carta vai para <b>${escape(name(s,target))}</b> (${own.dir==='left'?'esquerda':'direita'})</div>${btn('Passar minha carta','pass','full')}${s.incoming?`<div style="height:10px"></div>${btn('Revelar carta recebida','reveal','full secondary')}`:''}</div>`}else{html+=`<div class="panel center"><h2>Aguarde sua vez</h2><p>É a vez de <b>${escape(name(s,s.turn))}</b>.</p>${s.hands[uid]?`<div class="cardrow">${labelCard(s.hands[uid],'Sua carta')}</div>`:''}</div>`}}
else if(s.phase==='accusation'){html+=`<div class="panel center"><h2>Carta revelada!</h2><p>${escape(name(s,s.turn))} acusou ${escape(name(s,s.from))}.</p><div class="cardrow">${labelCard(s.reveal,'Carta recebida',true)}</div><p>Quem recebeu a carta deve informar se a acusação estava correta.</p>${uid===s.turn?`${btn('Acertei a acusação','correct','full')}<div style="height:10px"></div>${btn('Errei a acusação','wrong','full secondary')}`:'<div class="notice">Aguardando o acusador informar o resultado.</div>'}</div>`}
else if(s.phase==='confirm'){html+=`<div class="panel center"><h2>Confirmar eliminação?</h2><p><b>${escape(name(s,s.pendingLoser))}</b> será eliminado. <b>${escape(name(s,s.pendingWinner))}</b> ficará com a carta revelada.</p>${uid===s.turn?`${btn('Confirmar resultado','confirm','full')}<div style="height:10px"></div>${btn('Voltar','back','full secondary')}`:'<p>Aguardando confirmação do acusador.</p>'}</div>`}
else if(s.phase==='finished'){html+=`<div class="panel center"><h2>🏆 Vencedor!</h2><div class="big">${escape(name(s,active(s)[0]?.id))}</div><p>Fim da partida.</p>${uid===s.host?btn('Voltar à sala de espera','reset','full'):''}</div>`}
if(uid===s.host&&s.phase!=='lobby'&&s.phase!=='finished')html+=`<div class="panel"><details><summary>Gerenciar partida</summary><p>Interromper a partida e voltar à sala de espera, mantendo todos os jogadores. Você poderá adicionar mais participantes.</p>${btn('Encerrar partida e voltar à sala','reset','full danger')}</details></div>`;
screen.innerHTML=html;}
async function act(a){const s=state;if(!uid)return;if(a==='join'){const n=$('#myname')?.value.trim(),seat=Number($('#seat')?.value);if(!n||!seat)return alertMsg('Informe seu nome e sua posição.',true);localStorage.setItem('pc_name',n);return tx(s=>{if(s.phase!=='lobby'||Object.values(s.players||{}).some(p=>p.seat===seat))return; if(!Object.keys(s.players||{}).length)s.host=uid;s.players[uid]={id:uid,name:n,seat,active:true};return s})}
if(!s||!player(s,uid))return;
if(a==='start')return tx(s=>{if(s.host!==uid||s.phase!=='lobby')return;const ps=active(s);if(ps.length<2)return;for(let i=0;i<ps.length;i++)if(ps[i].seat!==i+1)return;s.hands={};ps.forEach(p=>s.hands[p.id]=makeCard(s));s.turn=ps[0].id;s.extra=null;s.incoming=null;s.from=null;s.ready={};s.phase='memorize';return s});
if(a==='ready')return tx(s=>{if(!['memorize','tableReveal','extraReveal'].includes(s.phase)||!player(s,uid)?.active)return;s.ready ||= {};s.ready[uid]=true;if(active(s).every(p=>s.ready[p.id])){if(s.phase==='memorize'){s.phase='tableReveal'}else if(s.phase==='tableReveal'){s.extra=makeCard(s);s.phase='extraReveal'}else{s.phase='play'}s.ready={}}return s});
if(a==='pass')return tx(s=>{if(s.phase!=='play'||s.turn!==uid)return;const outgoing=s.extra||s.hands[uid];if(!outgoing)return;const target=neighbor(s,uid,outgoing.dir);if(!target)return;if(s.extra){s.extra=null;s.incoming=outgoing;s.from=uid;s.turn=target}else{const received=s.incoming;if(!received)return;s.hands[uid]=received;s.incoming=outgoing;s.from=uid;s.turn=target}return s});
if(a==='reveal')return tx(s=>{if(s.phase!=='play'||s.turn!==uid||!s.incoming)return;s.reveal=s.incoming;s.phase='accusation';return s});
if(a==='correct'||a==='wrong')return tx(s=>{if(s.phase!=='accusation'||s.turn!==uid)return;s.pendingWinner=a==='correct'?uid:s.from;s.pendingLoser=a==='correct'?s.from:uid;s.phase='confirm';return s});
if(a==='back')return tx(s=>{if(s.phase!=='confirm'||s.turn!==uid)return;s.phase='accusation';s.pendingWinner=null;s.pendingLoser=null;return s});
if(a==='confirm')return tx(s=>{if(s.phase!=='confirm'||s.turn!==uid)return;const win=s.pendingWinner,lose=s.pendingLoser;if(!win||!lose||win===lose)return;s.players[lose].active=false;delete s.hands[lose];s.hands[win]=s.reveal;s.incoming=null;s.from=null;s.reveal=null;s.pendingWinner=null;s.pendingLoser=null;s.turn=win;if(s.host===lose)s.host=win;if(active(s).length===1){s.phase='finished';s.extra=null}else{s.extra=makeCard(s);s.ready={};s.phase='extraReveal'}return s});
if(a==='reset'){if(!confirm('Encerrar a partida e voltar à sala de espera? Os participantes serão mantidos.'))return;return tx(s=>{if(s.host!==uid)return;for(const p of Object.values(s.players||{}))p.active=true;s.phase='lobby';s.hands={};s.turn=null;s.incoming=null;s.extra=null;s.from=null;s.ready={};s.reveal=null;s.pendingWinner=null;s.pendingLoser=null;return s})}
if(a==='leave'){if(!confirm('Sair da mesa e liberar sua posição?'))return;return tx(s=>{if(s.phase!=='lobby'||!s.players?.[uid])return;delete s.players[uid];if(s.host===uid){const remaining=active(s);s.host=remaining[0]?.id||null}return s})}
if(a==='clearTable'){if(!confirm('Reiniciar a mesa? Todos serão removidos e precisarão entrar novamente.'))return;return tx(s=>{if(s.host!==uid||s.phase!=='lobby')return;return{...initial(),host:null,players:{},hands:{},ready:{}}})}
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(a)act(a)});
if(firebaseConfig.apiKey==='COLE_AQUI'){screen.innerHTML='<div class="panel"><h2>Configuração necessária</h2><p>Antes de publicar, preencha as credenciais do Firebase no início do script deste arquivo. Consulte o README incluído.</p></div>';$('#online').textContent='Não configurado';}else{try{const app=initializeApp(firebaseConfig);db=getDatabase(app);auth=getAuth(app);onAuthStateChanged(auth,u=>{if(u){uid=u.uid;onValue(ref(db,ROOT),snap=>{state=snap.val();$('#online').textContent='Online';render()},e=>alertMsg('Erro ao sincronizar: '+e.message,true))}else signInAnonymously(auth).catch(e=>alertMsg('Erro no login anônimo: '+e.message,true))})}catch(e){alertMsg('Configuração inválida: '+e.message,true)}}
</script></body></html>
